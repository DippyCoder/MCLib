name: Report an addon or theme
description: Report a malicious, misleading or broken addon or theme.
title: "[Report] <addon or theme name>"
labels: ["report"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Addon or theme?
      options:
        - Addon
        - Theme
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version (release tag)
      description: The release of the addon's or theme's repository the problem is in.
  - type: textarea
    id: details
    attributes:
      label: What's wrong?
      description: Include proof — logs, screenshots, or the offending code/CSS.
    validations:
      required: true
