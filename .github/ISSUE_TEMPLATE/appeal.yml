name: Appeal
description: Appeal a rejected submission, a removal, or a change to your addon's or theme's entry.
title: "[Appeal] <addon or theme name>"
labels: ["appeal"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Addon or theme?
      options:
        - Addon
        - Theme
    validations:
      required: true
  - type: input
    id: name
    attributes:
      label: Name
    validations:
      required: true
  - type: input
    id: reference
    attributes:
      label: Related issue or commit
      description: The submission issue, removal commit, or report this appeal is about.
  - type: textarea
    id: reason
    attributes:
      label: Why should the decision change?
      description: Explain what was wrong with the decision or what you've fixed since.
    validations:
      required: true
  - type: checkboxes
    id: owner
    attributes:
      label: Confirmation
      options:
        - label: I am an author of this addon or theme (or authorised by one).
          required: true
